name: Experiment / AgentSight GenAI

on:
  push:
    branches: ['experiment/sight/genai-ci*']

permissions:
  contents: read

concurrency:
  group: agentsight-genai-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.repository == 'lll-peanut/anolisa'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.89.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.11.6'

      - name: Configure experiment paths
        run: |
          echo "EXPERIMENT_OUTPUT=$RUNNER_TEMP/genai-experiment" >> "$GITHUB_ENV"
          echo "PYTHON=$RUNNER_TEMP/genai-venv/bin/python" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/genai-target" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/genai-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/genai-experiment/binaries"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: genai-experiment-v1
          workspaces: src/agentsight
          cache-targets: false
          cache-directories: ${{ env.CARGO_TARGET_DIR }}
          cache-bin: false
          cache-on-failure: true

      - name: Install dependencies and prepare kernel diagnostics
        timeout-minutes: 10
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=2 install -y \
            clang-15 llvm-15 libbpf-dev libelf-dev elfutils \
            libssl-dev zlib1g-dev pkg-config perl openssl curl util-linux linux-tools-generic
          echo "/usr/lib/llvm-15/bin" >> "$GITHUB_PATH"
          echo "LIBBPF_SYS_LIBRARY_PATH=$(pkg-config --variable=libdir libbpf)" >> "$GITHUB_ENV"
          uv venv --python 3.11.6 "$RUNNER_TEMP/genai-venv"
          uv pip install --python "$PYTHON" -r src/agentsight/scripts/benchmark/requirements.txt
          sudo -n -- "$PYTHON" -c 'import os; raise SystemExit(os.geteuid() != 0)'
          sudo sysctl -w kernel.sched_schedstats=1 || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          if ! findmnt --mountpoint /sys/kernel/tracing --types tracefs --noheadings >/dev/null; then
            sudo mkdir -p /sys/kernel/tracing
            sudo mount -t tracefs nodev /sys/kernel/tracing
          fi
          sudo cat /sys/kernel/tracing/events/syscalls/sys_exit_execve/id
          sudo test -r /sys/kernel/btf/vmlinux

      - name: Record hardware, quota, and SHA microbenchmarks
        run: |
          "$PYTHON" .github/scripts/agentsight-genai-diagnostics.py environment \
            --output "$EXPERIMENT_OUTPUT/environment.json"
          "$PYTHON" .github/scripts/agentsight-genai-diagnostics.py sha \
            --output "$EXPERIMENT_OUTPUT/sha.json"

      - name: Build ordinary SHA-accelerated binary
        working-directory: src/agentsight
        run: |
          cargo build --release --locked --bin agentsight \
            2>&1 | tee "$EXPERIMENT_OUTPUT/build-native.log"
          cp "$CARGO_TARGET_DIR/release/agentsight" "$EXPERIMENT_OUTPUT/binaries/native"
          sha256sum "$EXPERIMENT_OUTPUT/binaries/"* > "$EXPERIMENT_OUTPUT/binaries.sha256"
          "$PYTHON" - <<'PY'
          from pathlib import Path
          assert 'sha_ni' in Path('/proc/cpuinfo').read_text(), 'Runner must expose SHA acceleration'
          PY

      - name: Ordinary build, original 300-second profile
        run: |
          "$PYTHON" .github/scripts/agentsight-genai-diagnostics.py measure \
            --output "$EXPERIMENT_OUTPUT/native25" --binary "$EXPERIMENT_OUTPUT/binaries/native"

      - name: Ordinary build with external blocking stacks, diagnostic measurement
        continue-on-error: true
        run: |
          "$PYTHON" .github/scripts/agentsight-ring-diagnostics.py run \
            --output "$EXPERIMENT_OUTPUT/native25-blocking" --binary "$EXPERIMENT_OUTPUT/binaries/native"

      - name: Ordinary build without pacing, diagnostic comparison only
        run: |
          "$PYTHON" .github/scripts/agentsight-genai-diagnostics.py measure \
            --output "$EXPERIMENT_OUTPUT/native0" --binary "$EXPERIMENT_OUTPUT/binaries/native" \
            --cpu-budget 0

      - name: Disable periodic SQLite maintenance, diagnostic comparison only
        run: |
          "$PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path
          config = json.loads(Path('src/agentsight/agentsight.json').read_text())
          storage = config.setdefault('storage', {})
          storage['max_total_size_mb'] = 0
          for store in ('primary', 'genai', 'interruptions', 'trajectories', 'optimization',
                        'security_audit', 'reuse', 'causal', 'enforcement'):
              storage.setdefault(store, {})['check_interval_secs'] = 0
          path = Path(os.environ['EXPERIMENT_OUTPUT']) / 'no-periodic-maintenance.json'
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY
          "$PYTHON" .github/scripts/agentsight-genai-diagnostics.py measure \
            --output "$EXPERIMENT_OUTPUT/native25-no-maintenance" \
            --binary "$EXPERIMENT_OUTPUT/binaries/native" \
            --config "$EXPERIMENT_OUTPUT/no-periodic-maintenance.json"

      - name: Summarize diagnostic evidence
        if: always()
        run: |
          "$PYTHON" .github/scripts/agentsight-genai-diagnostics.py summarize \
            --output "$EXPERIMENT_OUTPUT" | tee "$EXPERIMENT_OUTPUT/summary.txt"
          cat "$EXPERIMENT_OUTPUT/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentsight-genai-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ env.EXPERIMENT_OUTPUT }}/*.json
            ${{ env.EXPERIMENT_OUTPUT }}/*.jsonl
            ${{ env.EXPERIMENT_OUTPUT }}/*.txt
            ${{ env.EXPERIMENT_OUTPUT }}/*.log
            ${{ env.EXPERIMENT_OUTPUT }}/*.sha256
            ${{ env.EXPERIMENT_OUTPUT }}/*.gz
            ${{ env.EXPERIMENT_OUTPUT }}/*/resource-summary.json
            ${{ env.EXPERIMENT_OUTPUT }}/*/resource-report.txt
            ${{ env.EXPERIMENT_OUTPUT }}/*/settings.json
            ${{ env.EXPERIMENT_OUTPUT }}/*/run-error.txt
            ${{ env.EXPERIMENT_OUTPUT }}/*/run/*.json
            ${{ env.EXPERIMENT_OUTPUT }}/*/run/*.csv
            ${{ env.EXPERIMENT_OUTPUT }}/*/run/*.prom
            ${{ env.EXPERIMENT_OUTPUT }}/*/run/*.md
            ${{ env.EXPERIMENT_OUTPUT }}/*/run/*.log
